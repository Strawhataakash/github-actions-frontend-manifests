apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-frontend
  namespace: frontend-staging
  labels:
    app: github-actions-frontend
    environment: staging
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: github-actions-frontend
  template:
    metadata:
      labels:
        app: github-actions-frontend
        environment: staging
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: 382677937583.dkr.ecr.ap-south-1.amazonaws.com/github-actions-frontend:REPLACE_WITH_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
